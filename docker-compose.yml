# One-command backend: Postgres 16 + pgvector and the FastAPI server.
#   GROQ_API_KEY=... docker compose up --build
# The frontend still runs with `cd frontend && npm install && npm run dev`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://research:research@db:5432/research
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      EMBED_MODEL: ${EMBED_MODEL:-all-MiniLM-L6-v2}
      HYBRID_RETRIEVAL: ${HYBRID_RETRIEVAL:-1}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hf-cache:/srv/.cache/huggingface

volumes:
  pgdata:
  hf-cache:
